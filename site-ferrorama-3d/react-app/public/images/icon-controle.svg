<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" fill="none">
  <rect width="120" height="80" rx="6" fill="#141b24"/>
  <rect x="1" y="1" width="118" height="78" rx="5" stroke="#2a3444" stroke-width="1"/>
  <!-- Panel background -->
  <rect x="20" y="12" width="80" height="50" rx="4" fill="#0a0e14" stroke="#1e2736" stroke-width="1"/>
  <!-- Panel header -->
  <rect x="20" y="12" width="80" height="8" rx="4" fill="#1a2230"/>
  <rect x="20" y="17" width="80" height="3" fill="#1a2230"/>
  <!-- LEDs row -->
  <g>
    <circle cx="30" cy="28" r="3" fill="#16a34a" opacity="0.9"/>
    <circle cx="30" cy="28" r="5" fill="#16a34a" opacity="0.15"/>
    <circle cx="42" cy="28" r="3" fill="#16a34a" opacity="0.9"/>
    <circle cx="42" cy="28" r="5" fill="#16a34a" opacity="0.15"/>
    <circle cx="54" cy="28" r="3" fill="#ca8a04" opacity="0.9"/>
    <circle cx="54" cy="28" r="5" fill="#ca8a04" opacity="0.15"/>
    <circle cx="66" cy="28" r="3" fill="#16a34a" opacity="0.9"/>
    <circle cx="66" cy="28" r="5" fill="#16a34a" opacity="0.15"/>
    <circle cx="78" cy="28" r="3" fill="#dc2626" opacity="0.9"/>
    <circle cx="78" cy="28" r="5" fill="#dc2626" opacity="0.15"/>
    <circle cx="90" cy="28" r="3" fill="#16a34a" opacity="0.9"/>
    <circle cx="90" cy="28" r="5" fill="#16a34a" opacity="0.15"/>
  </g>
  <!-- Buttons -->
  <g>
    <rect x="26" y="38" width="8" height="5" rx="1" fill="#2a3444" stroke="#3d4a5c" stroke-width="0.5"/>
    <rect x="38" y="38" width="8" height="5" rx="1" fill="#2a3444" stroke="#3d4a5c" stroke-width="0.5"/>
    <rect x="50" y="38" width="8" height="5" rx="1" fill="#004a8f" stroke="#0066b3" stroke-width="0.5"/>
    <rect x="62" y="38" width="8" height="5" rx="1" fill="#2a3444" stroke="#3d4a5c" stroke-width="0.5"/>
    <rect x="74" y="38" width="8" height="5" rx="1" fill="#e87722" stroke="#ff9830" stroke-width="0.5"/>
    <rect x="86" y="38" width="8" height="5" rx="1" fill="#2a3444" stroke="#3d4a5c" stroke-width="0.5"/>
  </g>
  <!-- LCD display -->
  <rect x="28" y="48" width="64" height="8" rx="1" fill="#0d1821" stroke="#1e2736" stroke-width="0.5"/>
  <text x="32" y="54" font-family="IBM Plex Mono, monospace" font-size="5" fill="#16a34a" opacity="0.8">STATUS: OK</text>
  <!-- Arduino chip -->
  <g transform="translate(45, 58)">
    <rect x="0" y="0" width="30" height="6" rx="1" fill="#1a2230" stroke="#2a3444" stroke-width="0.5"/>
    <text x="15" y="4.5" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="3.5" fill="#5b8def" opacity="0.7">MEGA</text>
  </g>
  <!-- Label -->
  <text x="60" y="73" text-anchor="middle" font-family="Inter, system-ui" font-size="8" fill="#94a3b8" font-weight="600" letter-spacing="0.05em">CONTROLE</text>
</svg>
