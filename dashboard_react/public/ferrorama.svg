<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-strong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="800" height="500" fill="#0a0e14"/>

  <!-- ============================================ -->
  <!-- TRILHOS - Linhas do circuito -->
  <!-- ============================================ -->

  <!-- Reta superior: esquerda → SW1 → S2 → S3 -->
  <path d="M 120 80 L 240 80" stroke="#3a4050" stroke-width="4" stroke-linecap="round"/>
  <path d="M 280 80 L 440 80" stroke="#3a4050" stroke-width="4" stroke-linecap="round"/>
  <path d="M 480 80 L 650 80" stroke="#3a4050" stroke-width="4" stroke-linecap="round"/>

  <!-- Curva direita superior → inferior -->
  <path d="M 650 80 C 720 80, 740 140, 740 200 C 740 260, 720 320, 650 380" stroke="#3a4050" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Reta inferior: S4 → SW3 → SW2 → S6 → Estação → S7 -->
  <path d="M 650 380 L 520 380" stroke="#3a4050" stroke-width="4" stroke-linecap="round"/>
  <path d="M 480 380 L 420 380" stroke="#3a4050" stroke-width="4" stroke-linecap="round"/>
  <path d="M 380 380 L 330 380" stroke="#3a4050" stroke-width="4" stroke-linecap="round"/>
  <path d="M 290 380 L 240 380" stroke="#3a4050" stroke-width="4" stroke-linecap="round"/>
  <path d="M 160 380 L 120 380" stroke="#3a4050" stroke-width="4" stroke-linecap="round"/>

  <!-- Curva esquerda inferior → superior -->
  <path d="M 120 380 C 50 380, 50 320, 50 260 C 50 200, 50 140, 120 80" stroke="#3a4050" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- ============================================ -->
  <!-- RAMAIS E CROSSOVER -->
  <!-- ============================================ -->

  <!-- Crossover: SW1 → SW3 (diagonal) -->
  <path d="M 260 80 L 500 380" stroke="#3a4050" stroke-width="3" stroke-dasharray="8,4" stroke-linecap="round"/>

  <!-- Ramal de SW2: via secundária com S5 -->
  <path d="M 400 380 L 450 450 L 600 450 L 650 380" stroke="#3a4050" stroke-width="3" stroke-linecap="round"/>

  <!-- ============================================ -->
  <!-- SENSORES (S1-S7) - Retângulos azuis -->
  <!-- ============================================ -->

  <!-- S1 - Reta superior, antes de SW1 -->
  <rect x="170" y="65" width="20" height="14" rx="3" fill="#2563eb" filter="url(#glow)"/>
  <text x="180" y="60" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="11" font-weight="bold">S1</text>

  <!-- S2 - Reta superior, entre SW1 e S3 -->
  <rect x="440" y="65" width="20" height="14" rx="3" fill="#2563eb" filter="url(#glow)"/>
  <text x="450" y="60" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="11" font-weight="bold">S2</text>

  <!-- S3 - Reta superior, antes da curva direita -->
  <rect x="620" y="65" width="20" height="14" rx="3" fill="#2563eb" filter="url(#glow)"/>
  <text x="630" y="60" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="11" font-weight="bold">S3</text>

  <!-- S4 - Reta inferior, após SW3 -->
  <rect x="560" y="365" width="20" height="14" rx="3" fill="#2563eb" filter="url(#glow)"/>
  <text x="570" y="360" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="11" font-weight="bold">S4</text>

  <!-- S5 - Via secundária (ramal de SW2) -->
  <rect x="500" y="435" width="20" height="14" rx="3" fill="#2563eb" filter="url(#glow)"/>
  <text x="510" y="430" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="11" font-weight="bold">S5</text>

  <!-- S6 - Reta inferior, entre SW2 e Estação -->
  <rect x="310" y="365" width="20" height="14" rx="3" fill="#2563eb" filter="url(#glow)"/>
  <text x="320" y="360" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="11" font-weight="bold">S6</text>

  <!-- S7 - Reta inferior, antes da Estação -->
  <rect x="170" y="365" width="20" height="14" rx="3" fill="#2563eb" filter="url(#glow)"/>
  <text x="180" y="360" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="11" font-weight="bold">S7</text>

  <!-- ============================================ -->
  <!-- ESTAÇÃO / PLATAFORMA -->
  <!-- ============================================ -->
  <rect x="200" y="368" width="40" height="22" rx="4" fill="#d97706" stroke="#f59e0b" stroke-width="2"/>
  <text x="220" y="383" text-anchor="middle" fill="#fef3c7" font-family="monospace" font-size="8" font-weight="bold">EST</text>

  <!-- ============================================ -->
  <!-- SEMÁFORO / CANCELA -->
  <!-- ============================================ -->
  <circle cx="220" cy="420" r="8" fill="#dc2626" filter="url(#glow-strong)"/>
  <text x="220" y="445" text-anchor="middle" fill="#fca5a5" font-family="monospace" font-size="9">SEMAF</text>

  <!-- ============================================ -->
  <!-- SWITCHES (SW1, SW2, SW3) - Blocos cinza -->
  <!-- ============================================ -->

  <!-- SW1 - Reta superior -->
  <rect x="240" y="68" width="40" height="22" rx="4" fill="#374151" stroke="#6b7280" stroke-width="2"/>
  <text x="260" y="83" text-anchor="middle" fill="#d1d5db" font-family="monospace" font-size="10" font-weight="bold">SW1</text>

  <!-- SW2 - Reta inferior, centro -->
  <rect x="380" y="368" width="40" height="22" rx="4" fill="#374151" stroke="#6b7280" stroke-width="2"/>
  <text x="400" y="383" text-anchor="middle" fill="#d1d5db" font-family="monospace" font-size="10" font-weight="bold">SW2</text>

  <!-- SW3 - Reta inferior, direita -->
  <rect x="480" y="368" width="40" height="22" rx="4" fill="#374151" stroke="#6b7280" stroke-width="2"/>
  <text x="500" y="383" text-anchor="middle" fill="#d1d5db" font-family="monospace" font-size="10" font-weight="bold">SW3</text>

  <!-- ============================================ -->
  <!-- TÍTULO E LEGENDA -->
  <!-- ============================================ -->
  <text x="400" y="25" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="12" font-weight="bold">DIAGRAMA DE TRILHOS — MAQUETE INDUSTRIAL</text>

  <!-- Legenda -->
  <rect x="20" y="460" width="12" height="8" rx="2" fill="#3a4050"/>
  <text x="38" y="468" fill="#6b7280" font-family="monospace" font-size="9">Trilho</text>

  <rect x="100" y="460" width="12" height="8" rx="2" fill="#2563eb"/>
  <text x="118" y="468" fill="#6b7280" font-family="monospace" font-size="9">Sensor</text>

  <rect x="180" y="460" width="12" height="8" rx="2" fill="#374151" stroke="#6b7280" stroke-width="1"/>
  <text x="198" y="468" fill="#6b7280" font-family="monospace" font-size="9">Desvio</text>

  <rect x="260" y="460" width="12" height="8" rx="2" fill="#d97706"/>
  <text x="278" y="468" fill="#6b7280" font-family="monospace" font-size="9">Estação</text>

  <circle cx="356" cy="464" r="5" fill="#dc2626"/>
  <text x="368" y="468" fill="#6b7280" font-family="monospace" font-size="9">Semáforo</text>

  <line x1="430" y1="464" x2="450" y2="464" stroke="#3a4050" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="456" y="468" fill="#6b7280" font-family="monospace" font-size="9">Crossover</text>
</svg>
