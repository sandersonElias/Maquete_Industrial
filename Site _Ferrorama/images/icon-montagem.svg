  <!-- Rails -->
  <line x1="25" y1="42" x2="95" y2="42" stroke="#8b9cb3" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="25" y1="39" x2="95" y2="39" stroke="#8b9cb3" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Cross ties -->
