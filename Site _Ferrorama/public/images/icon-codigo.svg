<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" fill="none">
  <rect width="120" height="80" rx="6" fill="#141b24"/>
  <rect x="1" y="1" width="118" height="78" rx="5" stroke="#2a3444" stroke-width="1"/>
  <!-- Terminal window -->
  <rect x="22" y="12" width="76" height="48" rx="4" fill="#0d1118" stroke="#2a3444" stroke-width="1"/>
  <!-- Terminal header -->
  <rect x="22" y="12" width="76" height="10" rx="4" fill="#1a2230"/>
  <rect x="22" y="18" width="76" height="4" fill="#1a2230"/>
  <!-- Traffic lights -->
  <circle cx="30" cy="17" r="2" fill="#dc2626" opacity="0.7"/>
  <circle cx="38" cy="17" r="2" fill="#ca8a04" opacity="0.7"/>
  <circle cx="46" cy="17" r="2" fill="#16a34a" opacity="0.7"/>
  <!-- Code lines -->
  <g font-family="IBM Plex Mono, monospace" font-size="6">
    <text x="28" y="32" fill="#64748b">const</text>
    <text x="50" y="32" fill="#ff9830">motor</text>
    <text x="72" y="32" fill="#64748b">= 5;</text>
    <text x="28" y="40" fill="#64748b">if</text>
    <text x="36" y="40" fill="#c5cdd8">(</text>
    <text x="40" y="40" fill="#5b8def">sensor</text>
    <text x="64" y="40" fill="#c5cdd8">) {</text>
    <text x="28" y="48" fill="#8b9cb3">  analogWrite</text>
    <text x="28" y="56" fill="#c5cdd8">}</text>
  </g>
  <!-- Code bracket decoration -->
  <text x="82" y="34" font-family="IBM Plex Mono, monospace" font-size="18" fill="#e87722" opacity="0.3">&lt;/&gt;</text>
  <!-- Label -->
  <text x="60" y="70" text-anchor="middle" font-family="Inter, system-ui" font-size="8" fill="#94a3b8" font-weight="600" letter-spacing="0.05em">CÓDIGO</text>
</svg>
