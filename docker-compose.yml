services:
  # Banco de Dados - Postgres
  postgres:
    image: postgis/postgis:16-3.4
    container_name: maquete-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=maquete_industrial
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend_nodejs/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d maquete_industrial"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - maquete-network

  # Backend (API + WebSocket)
  backend:
    build:
      context: ./backend_nodejs
      dockerfile: Dockerfile
    container_name: maquete-backend
    ports:
      - "4000:4000"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      # PostgreSQL local (padrao) ou Render (se DATABASE_URL estiver no .env)
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/maquete_industrial}
      # Redis
      - REDIS_URL=redis://redis:6379
      # Configuracoes gerais
      - JWT_SECRET=${JWT_SECRET:-chave_secreta}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      - GATEWAY_API_KEY=${GATEWAY_API_KEY:-chave_api}
      - PORT=${PORT:-4000}
      - NODE_ENV=${NODE_ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ./backend_nodejs/reports:/app/reports
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - maquete-network

  # Gateway Bluetooth - MODO SIMULACAO (plano B de backup no dia da feira)
  # Para Bluetooth real, rode o gateway nativo no host:
  #   cd gateway_bluetooth && npm start
  gateway:
    build:
      context: ./gateway_bluetooth
      dockerfile: Dockerfile
    container_name: maquete-gateway
    environment:
      - BACKEND_WS_URL=http://backend:4000
      - BACKEND_API_URL=http://backend:4000/api
      - GATEWAY_API_KEY=${GATEWAY_API_KEY:-chave_api}
      - GATEWAY_ID=${GATEWAY_ID:-gateway-01}
      - SIMULATION_MODE=true
      - BT_DEVICE_FERROVIA=${BT_DEVICE_FERROVIA:-98:D3:31:FD:15:F5}
      - BT_DEVICE_TRUCK01=${BT_DEVICE_TRUCK01:-98:D3:31:FD:15:A1}
      - SERIAL_BAUD=${SERIAL_BAUD:-9600}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      - backend
    networks:
      - maquete-network

  # Dashboard (React)
  dashboard:
    build:
      context: ./dashboard_react
      dockerfile: Dockerfile
    container_name: maquete-dashboard
    ports:
      - "3000:3000"
    networks:
      - maquete-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: maquete-redis
    ports:
      - "6379:6379"
    networks:
      - maquete-network

volumes:
  postgres_data:

networks:
  maquete-network:
    driver: bridge
