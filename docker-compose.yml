services:
  # Backend (API + WebSocket)
  backend:
    build:
      context: ./backend_nodejs
      dockerfile: Dockerfile
    container_name: maquete-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=${PORT:-4000}
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-86400000}
      - GATEWAY_API_KEY=${GATEWAY_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - COMMAND_TIMEOUT_MS=${COMMAND_TIMEOUT_MS:-30000}
    volumes:
      - ./backend_nodejs/reports:/app/reports
    networks:
      - maquete-network

  # Gateway Bluetooth
  gateway:
    build:
      context: ./gateway_bluetooth
      dockerfile: Dockerfile
    container_name: maquete-gateway
    environment:
      - BACKEND_WS_URL=http://backend:4000/gateway
      - BACKEND_API_URL=http://backend:4000/api
      - GATEWAY_API_KEY=${GATEWAY_API_KEY}
      - GATEWAY_ID=${GATEWAY_ID:-gateway-docker-01}
      - SIMULATION_MODE=${SIMULATION_MODE:-true}
      - BT_DEVICE_FERROVIA=${BT_DEVICE_FERROVIA:-98:D3:31:FD:15:F5}
      - BT_DEVICE_TRUCK01=${BT_DEVICE_TRUCK01:-98:D3:31:FD:15:A1}
      - SERIAL_BAUD=${SERIAL_BAUD:-9600}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      - backend
    networks:
      - maquete-network

  # Dashboard (React) - build com vars Supabase
  dashboard:
    build:
      context: ./dashboard_react
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:4000}
        - REACT_APP_SUPABASE_URL=${REACT_APP_SUPABASE_URL}
        - REACT_APP_SUPABASE_ANON_KEY=${REACT_APP_SUPABASE_ANON_KEY}
    container_name: maquete-dashboard
    ports:
      - "3000:3000"
    networks:
      - maquete-network

networks:
  maquete-network:
    driver: bridge